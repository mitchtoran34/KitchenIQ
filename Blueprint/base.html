<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>KitchenIQ</title>

  <style>
    :root{
      /* Foodie beige + green palette */
      --bg: #f6f1e7;           /* beige background */
      --panel: #fffaf0;        /* warm off-white */
      --card: rgba(255,255,255,0.82);
      --border: rgba(21, 71, 52, 0.16);

      --text: #123b2a;         /* deep green text */
      --muted: rgba(18,59,42,0.72);

      --accent: #1f7a4a;       /* green accent */
      --accent2: #2ea665;      /* brighter green */
      --warm: #c98b2a;         /* warm spice accent */

      --shadow: 0 14px 40px rgba(18, 59, 42, 0.12);
      --radius: 18px;
      --radius2: 14px;

      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(46,166,101,0.10), transparent 55%),
        radial-gradient(900px 500px at 85% 15%, rgba(201,139,42,0.12), transparent 55%),
        linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 18px 30px;
    }

    /* Top nav */
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(246,241,231,0.78);
      border-bottom: 1px solid rgba(21, 71, 52, 0.10);
    }
    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(31,122,74,0.95), rgba(201,139,42,0.85));
      box-shadow: 0 10px 24px rgba(18, 59, 42, 0.16);
      display: grid;
      place-items: center;
      font-size: 16px;
      color: #fffaf0;
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-weight: 650;
      font-size: 12px;
      margin-top: 2px;
    }
    .navlinks {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill {
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(21, 71, 52, 0.16);
      background: rgba(255,255,255,0.55);
      color: var(--text);
      font-weight: 750;
      font-size: 14px;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .pill:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.72);
      border-color: rgba(21, 71, 52, 0.28);
    }

    /* Common UI */
    .page-title {
      font-size: 28px;
      margin: 18px 0 6px;
      letter-spacing: -0.2px;
    }
    .page-subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      max-width: 80ch;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 16px;
    }
    .card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-inner { padding: 16px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(21, 71, 52, 0.16);
      background: rgba(255,255,255,0.65);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .badge-dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: var(--accent2);
      box-shadow: 0 0 0 4px rgba(46,166,101,0.16);
    }

    .btn {
      border: 1px solid rgba(21, 71, 52, 0.18);
      background: rgba(255,255,255,0.70);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.88);
      border-color: rgba(21, 71, 52, 0.28);
    }
    .btn.primary {
      color: #fffaf0;
      background: linear-gradient(135deg, rgba(31,122,74,0.96), rgba(46,166,101,0.86));
      border-color: rgba(31,122,74,0.35);
    }
    .btn.ghost { background: transparent; }

    .input {
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(21, 71, 52, 0.18);
      background: rgba(255,255,255,0.82);
      color: var(--text);
      outline: none;
    }
    .input::placeholder { color: rgba(18,59,42,0.50); }

    .muted { color: var(--muted); }
    .hr { height: 1px; background: rgba(21, 71, 52, 0.12); margin: 14px 0; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: rgba(31,122,74,0.08);
      border: 1px solid rgba(31,122,74,0.16);
      padding: 2px 6px;
      border-radius: 10px;
      color: rgba(18,59,42,0.95);
    }

    footer {
      margin-top: 24px;
      color: rgba(18,59,42,0.55);
      font-size: 12.5px;
      text-align: center;
    }

    @media (max-width: 900px){
      .nav-inner { align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <div class="nav-inner">
      <div class="brand">
        <div class="logo">🍳</div>
        <div>
          KitchenIQ
          <small>pantry → recipes, simplified</small>
        </div>
      </div>

      <div class="navlinks">
        <a class="pill" href="/">Home</a>
        <a class="pill" href="/ingredients">My Ingredients</a>
        <a class="pill" href="/Output">Output</a>
        <a href="/tryout">Try Out</a>
      </div>
    </div>
  </div>

  <div class="shell">
    {% block content %}{% endblock %}
    <footer>KitchenIQ </footer>
  </div>

</body>
</html>
